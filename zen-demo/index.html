<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>zen photon garden</title>
    <meta name="description" content="An interactive raytracer art-toy for HTML5 browsers." />
    <meta name="apple-mobile-web-app-title" content="Zen photon">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="apple-touch-icon" href="logo-57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="logo-72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="logo-114.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="logo-144.png" />
    <link rel="Shortcut Icon" href="favicon.ico" type="image/x-icon" />
    <!-- Version query busts stale browser caches. Bump it whenever
         zenphoton.js is rebuilt: it also selects the worker version, so a
         cached copy of this file silently pins the old workers too. -->
    <script src='zenphoton.js?v=6' type='text/javascript'></script>
    <style>

        @font-face {
            font-family: 'Roboto';
            font-style: normal;
            font-weight: 400;
            src: local('Roboto Regular'), local('Roboto-Regular'), url(roboto.ttf) format('truetype');
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0; height: 100%; overflow: hidden;
            background: #111;
            color: rgba(255, 255, 240, 0.4);
            font-size: 16px;
            font-family: 'Roboto', sans-serif;
            touch-action: none;
            user-select: none;
        }

        #centerColumn {
            width: 100%;
            height: 100%;
        }

        #workspace {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: black;
        }

        #workspace canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        #help {
            position: absolute;
            display: none;
            left: 0;
            right: 0;
            bottom: 0;
            height: 33%;
            text-align: center;
            font-size: 48px;
            color: rgba(0, 0, 0, 0.8);
        }

        #notsupported {
            position: absolute;
            display: block;
            left: 0;
            right: 0;
            bottom: 0;
            height: 75%;
            text-align: center;
        }

        #notsupported p {
            font-family: 'Verdana', sans-serif;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.35);
        }

        /* Back to picker */
        .back-btn {
            position: fixed; top: 14px; left: 14px;
            z-index: 30;
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255, 255, 240, 0.8);
            font-size: 13px;
            text-decoration: none;
        }
        .back-btn:active { background: rgba(0,0,0,0.5); }

    </style>
</head>
<body>

    <a class="back-btn" href="../index.html">← Back</a>

    <div id='centerColumn'>

        <div id='workspace'>
            <canvas id='histogramImage'></canvas>

            <div id='notsupported'>
                <h1>Oh no.</h1>
                <p>Zen photon garden is an interactive raytracer art-toy for HTML5 browsers.</p>
                <p>But it looks like your browser isn't supported!</p>
                <p>Try the latest version of Chrome or Firefox.</p>
                <p>(You'll need JavaScript, Canvas, Web Workers, and Typed Arrays.)</p>
            </div>

            <div id='help'>
                Draw on me.
            </div>

        </div>

    </div>
</body>
</html>
